[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyDySP"
version = "0.2.2"
description = "Python Dynamic Signal Processing"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Dr Dimitris Karamitros", email = "d.karamitros@bristol.ac.uk" }
]
keywords = ["signal-processing", "dynamic-systems", "pyDySP"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "matplotlib>=3.5",
  "tabulate>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "sphinx",
  "sphinx-rtd-theme",
  "black",
  "ruff",
  "pre-commit",
]
ema = [
  "sdypy-EMA",
]

[project.urls]
"Homepage" = "https://github.com/dkaramitros/pyDySP"
"Documentation" = "https://pydysp.readthedocs.io/"
"Source" = "https://github.com/dkaramitros/pyDySP"
"Bug Tracker" = "https://github.com/dkaramitros/pyDySP/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
